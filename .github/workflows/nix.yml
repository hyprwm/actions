name: Build

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
        description: Command to run
      checkout:
        required: false
        type: boolean
        default: true
        description: Whether to check out the caller repository before running the command
      submodules:
        required: false
        type: string
        default: "false"
        description: actions/checkout submodules mode, e.g. false or recursive
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: inputs.checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}

      - name: Set up Nix
        uses: hyprwm/actions/nix-setup@main
        with:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: ${{ inputs.command }}
